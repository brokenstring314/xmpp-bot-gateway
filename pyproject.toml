[project]
name = "xmpp-bot-gateway"
version = "0.1.0"
description = "Run OneBot v11 chatbots (AstrBot, NoneBot2, LangBot) on XMPP/Jabber, with OMEMO"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["xmpp", "jabber", "onebot", "onebot-v11", "chatbot", "bot", "gateway", "omemo", "astrbot", "nonebot", "langbot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "slixmpp>=1.8",
  "aiohttp>=3.9",
  "pydantic>=2.6",
  "aiosqlite>=0.20",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
omemo = ["slixmpp-omemo>=2.2", "oldmemo[xml]>=2.0", "twomemo[xml]>=2.0"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "coverage", "hypothesis", "tomli-w"]

[project.urls]
Homepage = "https://github.com/brokenstring314/xmpp-bot-gateway"
Documentation = "https://github.com/brokenstring314/xmpp-bot-gateway#readme"
Issues = "https://github.com/brokenstring314/xmpp-bot-gateway/issues"
Changelog = "https://github.com/brokenstring314/xmpp-bot-gateway/blob/main/docs/ROADMAP.md"

[project.scripts]
xmpp-gateway = "xmpp_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "README.zh-CN.md", "LICENSE", "config.example.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/xmpp_gateway"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
