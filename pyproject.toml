[project]
name = "xmpp-bot-gateway"
version = "0.0.1"
description = "XMPP gateway exposing direct and group chats over the OneBot v11 protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "slixmpp>=1.8",
  "aiohttp>=3.9",
  "pydantic>=2.6",
  "aiosqlite>=0.20",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
omemo = ["slixmpp-omemo>=2.2", "oldmemo[xml]>=2.0", "twomemo[xml]>=2.0"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "hypothesis", "tomli-w"]

[project.scripts]
xmpp-gateway = "xmpp_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmpp_gateway"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
