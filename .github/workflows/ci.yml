name: ci
on: [push, pull_request]
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y prosody && sudo systemctl stop prosody || true
      - run: set -o pipefail; pip install -e ".[omemo,dev]" 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; ruff check src --select F,E9,B,S --ignore S101,S110 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -m pytest -q tests/test_cq.py tests/test_props.py 2>&1 | tee -a /tmp/ci.log
      - name: start local Prosody
        run: |
          echo '== prosody' >> /tmp/ci.log
          setsid bash tests/prosody/run.sh > /tmp/prosody.log 2>&1 < /dev/null &
          for i in $(seq 30); do nc -z 127.0.0.1 15222 && break; sleep 1; done
      - run: set -o pipefail; python -u tests/e2e_p0.py 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -u tests/e2e_media.py 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -u tests/e2e_reply.py 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -u tests/e2e_mam.py 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -u tests/e2e_redteam.py 2>&1 | tee -a /tmp/ci.log
      - run: set -o pipefail; python -u tests/e2e_chaos.py 2>&1 | tee -a /tmp/ci.log
      - if: failure()
        run: tail -50 /tmp/prosody.log tests/prosody/run/prosody.log || true
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "CI failed at ${GITHUB_SHA::7}. Step: see run ${GITHUB_RUN_ID}"; echo '```'; tail -c 30000 /tmp/ci.log 2>/dev/null; tail -40 tests/prosody/run/prosody.log 2>/dev/null; echo '```'; } > /tmp/body.md
          gh issue create --title "CI failure ${GITHUB_SHA::7}" --body-file /tmp/body.md --label ci-failure || gh issue create --title "CI failure ${GITHUB_SHA::7}" --body-file /tmp/body.md
